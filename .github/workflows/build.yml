name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"

      - name: Read protocol version
        id: proto
        run: |
          PROTO=$(./target/release/simple-chat --version | sed -n 's/^Protocol Version: //p')
          echo "version=$PROTO" >> "$GITHUB_OUTPUT"

      - name: Package binary
        run: |
          strip target/release/simple-chat
          cp target/release/simple-chat simple-chat-linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Protocol Version: ${{ steps.proto.outputs.version }}"
          files: simple-chat-linux-x86_64
